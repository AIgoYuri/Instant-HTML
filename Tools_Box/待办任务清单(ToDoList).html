<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简待办 - LocalStorage 版</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --text-color: #1f2937;
            --danger-color: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding-top: 100px;
            min-height: 100vh;
        }

        .todo-app {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 800;
        }

        /* 输入区域 */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button#add-btn {
            padding: 12px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        button#add-btn:hover { opacity: 0.9; }

        /* 列表区域 */
        ul { list-style: none; }

        li {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        li:last-child { border-bottom: none; }

        .todo-text {
            flex: 1;
            margin: 0 12px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .completed .todo-text {
            text-decoration: line-through;
            color: #9ca3af;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .del-btn {
            background: none;
            border: none;
            color: #d1d5db;
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.2s;
            padding: 4px 8px;
        }

        .del-btn:hover { color: var(--danger-color); }

        .empty-state {
            text-align: center;
            color: #9ca3af;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<div class="todo-app">
    <h1>我的待办事项</h1>
    
    <div class="input-group">
        <input type="text" id="todo-input" placeholder="输入新任务..." autocomplete="off">
        <button id="add-btn">添加</button>
    </div>

    <ul id="todo-list">
        </ul>
    
    <div id="empty-msg" class="empty-state" style="display: none;">暂无任务，开启高效一天吧！</div>
</div>

<script>
    const input = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const todoList = document.getElementById('todo-list');
    const emptyMsg = document.getElementById('empty-msg');

    // 1. 初始化数据：从 LocalStorage 获取，如果没有则为空数组
    let todos = JSON.parse(localStorage.getItem('my_todos')) || [];

    // 渲染函数：将数据变为 HTML
    function render() {
        todoList.innerHTML = '';
        
        if (todos.length === 0) {
            emptyMsg.style.display = 'block';
        } else {
            emptyMsg.style.display = 'none';
        }

        todos.forEach((todo, index) => {
            const li = document.createElement('li');
            if (todo.completed) li.classList.add('completed');

            li.innerHTML = `
                <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${index})">
                <span class="todo-text" onclick="toggleTodo(${index})">${escapeHtml(todo.text)}</span>
                <button class="del-btn" onclick="deleteTodo(${index})">&times;</button>
            `;
            todoList.appendChild(li);
        });

        // 2. 每次渲染后，将最新数据存入 LocalStorage
        localStorage.setItem('my_todos', JSON.stringify(todos));
    }

    // 添加任务
    function addTodo() {
        const text = input.value.trim();
        if (text) {
            todos.push({ text: text, completed: false });
            input.value = '';
            render();
        }
    }

    // 删除任务
    function deleteTodo(index) {
        todos.splice(index, 1);
        render();
    }

    // 切换完成状态
    function toggleTodo(index) {
        todos[index].completed = !todos[index].completed;
        render();
    }

    // 防止 XSS 攻击的转义函数
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // 事件监听
    addBtn.addEventListener('click', addTodo);
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addTodo();
    });

    // 首次加载渲染
    render();
</script>

</body>
</html>
