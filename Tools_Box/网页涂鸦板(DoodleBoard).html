<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简网页涂鸦板</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --toolbar-bg: #ffffff;
            --primary-color: #4f46e5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* 工具栏样式 */
        .toolbar {
            background: var(--toolbar-bg);
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            z-index: 10;
        }

        .tool-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label { font-size: 14px; color: #64748b; font-weight: 600; }

        input[type="color"] {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        input[type="range"] { cursor: pointer; accent-color: var(--primary-color); }

        .btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-clear { background: #fee2e2; color: #ef4444; }
        .btn-clear:hover { background: #fecaca; }

        .btn-save { background: var(--primary-color); color: white; }
        .btn-save:hover { opacity: 0.9; }

        /* 画布区域 */
        #canvas-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            cursor: crosshair; /* 绘图时显示十字光标 */
            overflow: hidden;
            display: flex;
        }

        canvas {
            display: block;
            background: #fff;
        }
    </style>
</head>
<body>

<div class="toolbar">
    <div class="tool-item">
        <label>画笔颜色</label>
        <input type="color" id="colorPicker" value="#4f46e5">
    </div>

    <div class="tool-item">
        <label>粗细</label>
        <input type="range" id="lineWidth" min="1" max="50" value="5">
    </div>

    <button class="btn btn-clear" id="clearBtn">清空画布</button>
    <button class="btn btn-save" id="saveBtn">保存为图片</button>
</div>

<div id="canvas-container">
    <canvas id="paintCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const colorPicker = document.getElementById('colorPicker');
    const lineWidthRange = document.getElementById('lineWidth');
    const clearBtn = document.getElementById('clearBtn');
    const saveBtn = document.getElementById('saveBtn');

    // 初始化画布大小
    function resizeCanvas() {
        // 让画布自适应窗口大小，减去工具栏和外边距的空间
        canvas.width = window.innerWidth * 0.85;
        canvas.height = window.innerHeight * 0.75;
        
        // 重新设定画布背景为白色（否则导出的图片背景是透明的）
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 绘图状态变量
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;

    function startDrawing(e) {
        isDrawing = true;
        [lastX, lastY] = [e.offsetX, e.offsetY];
    }

    function draw(e) {
        if (!isDrawing) return;

        ctx.beginPath();
        // 设置绘图样式
        ctx.strokeStyle = colorPicker.value;
        ctx.lineWidth = lineWidthRange.value;
        ctx.lineCap = 'round'; // 让笔触转弯更平滑
        ctx.lineJoin = 'round';

        // 绘制线条
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(e.offsetX, e.offsetY);
        ctx.stroke();

        [lastX, lastY] = [e.offsetX, e.offsetY];
    }

    function stopDrawing() {
        isDrawing = false;
    }

    // 事件监听
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseout', stopDrawing);

    // 清空画布
    clearBtn.addEventListener('click', () => {
        if(confirm('确定要清空画布吗？')) {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    });

    // 保存图片
    saveBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = `my-doodle-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
</script>

</body>
</html>
