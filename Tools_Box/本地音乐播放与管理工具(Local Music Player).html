<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极客本地音乐中心</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-side: #000000;
            --accent: #1DB954;
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
            --card-hover: #282828;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 侧边栏：文件夹分类 */
        aside {
            width: 260px;
            background-color: var(--bg-side);
            display: flex;
            flex-direction: column;
            padding: 20px 10px;
            border-right: 1px solid #222;
        }

        .logo { font-size: 20px; font-weight: bold; margin-bottom: 30px; padding-left: 10px; color: var(--accent); }

        .btn-add-folder {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        .btn-add-folder:hover { transform: scale(1.03); }

        .folder-list { overflow-y: auto; flex-grow: 1; }
        .folder-item {
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            color: var(--text-dim);
            transition: 0.3s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }
        .folder-item:hover, .folder-item.active { background: var(--card-hover); color: #fff; }

        /* 主界面：歌曲列表 */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 40px;
            overflow-y: auto;
            background: linear-gradient(to bottom, #222, var(--bg-main) 40%);
        }

        .header-info h1 { margin: 0; font-size: 32px; }
        .header-info p { color: var(--text-dim); }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; color: var(--text-dim); border-bottom: 1px solid #333; padding: 10px; font-weight: normal; font-size: 13px; }
        td { padding: 12px 10px; border-bottom: 1px solid transparent; font-size: 14px; color: var(--text-dim); cursor: pointer; }
        tr:hover td { background: rgba(255,255,255,0.1); color: #fff; }
        tr.active td { color: var(--accent); }

        /* 底部控制栏 */
        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 90px;
            background: #181818;
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .current-track { width: 30%; display: flex; align-items: center; }
        .track-name { font-size: 14px; font-weight: 500; }
        .track-folder { font-size: 12px; color: var(--text-dim); }

        .player-controls { width: 40%; display: flex; flex-direction: column; align-items: center; }
        .control-btns { display: flex; align-items: center; gap: 20px; margin-bottom: 8px; }
        .control-btns button { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px; transition: 0.2s; }
        .control-btns button:hover { color: #fff; }
        .control-btns button.active { color: var(--accent); }
        .play-pause { background: #fff !important; color: #000 !important; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        .progress-container { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-dim); }
        .progress-bar { flex-grow: 1; height: 4px; background: #4f4f4f; border-radius: 2px; cursor: pointer; position: relative; }
        #progress-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; }

        .volume-controls { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
        #volumeSlider { width: 100px; accent-color: var(--accent); cursor: pointer; }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #555; }
    </style>
</head>
<body>

    <aside>
        <div class="logo">MyMusic Library</div>
        <button class="btn-add-folder" id="addFolderBtn">+ 添加本地文件夹</button>
        <div class="folder-list" id="folderList">
            </div>
    </aside>

    <main>
        <div class="header-info">
            <h1 id="viewTitle">请选择文件夹</h1>
            <p id="viewSubtitle">共 0 首音乐</p>
        </div>
        <table id="songTable">
            <thead>
                <tr>
                    <th style="width: 40px">#</th>
                    <th>标题</th>
                    <th>格式</th>
                </tr>
            </thead>
            <tbody id="songListBody">
                </tbody>
        </table>
    </main>

    <footer>
        <div class="current-track">
            <div>
                <div class="track-name" id="footerName">未在播放</div>
                <div class="track-folder" id="footerFolder">-</div>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-btns">
                <button title="随机播放" id="shuffleBtn">⇄</button>
                <button title="上一首" id="prevBtn">⏮</button>
                <button class="play-pause" id="playPauseBtn">▶</button>
                <button title="下一首" id="nextBtn">⏭</button>
                <button title="循环模式" id="loopBtn">🔁</button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar">
                    <div id="progress-fill"></div>
                </div>
                <span id="durationTime">0:00</span>
            </div>
        </div>

        <div class="volume-controls">
            <span>Vol</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
        </div>
    </footer>

    <audio id="audioElement"></audio>

<script>
    const audio = document.getElementById('audioElement');
    const folderListUI = document.getElementById('folderList');
    const songListBody = document.getElementById('songListBody');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const progressFill = document.getElementById('progress-fill');
    const progressBar = document.getElementById('progressBar');
    const volumeSlider = document.getElementById('volumeSlider');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const loopBtn = document.getElementById('loopBtn');

    let library = {}; // 结构: { "文件夹名": [fileHandles] }
    let currentFolderName = "";
    let currentQueue = []; 
    let currentIndex = -1;
    let isShuffle = false;
    let loopMode = 0; // 0: 列表循环, 1: 单曲循环

    // 1. 添加文件夹
    document.getElementById('addFolderBtn').onclick = async () => {
        try {
            const dirHandle = await window.showDirectoryPicker();
            const files = [];
            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'file' && /\.(mp3|wav|flac|ogg|m4a)$/i.test(entry.name)) {
                    files.push(entry);
                }
            }
            
            if (files.length > 0) {
                library[dirHandle.name] = files.sort((a,b) => a.name.localeCompare(b.name));
                updateFolderUI();
                switchFolder(dirHandle.name);
            } else {
                alert("该文件夹内没找到音乐文件。");
            }
        } catch (e) { console.log("用户取消了选择"); }
    };

    function updateFolderUI() {
        folderListUI.innerHTML = "";
        Object.keys(library).forEach(name => {
            const div = document.createElement('div');
            div.className = `folder-item ${name === currentFolderName ? 'active' : ''}`;
            div.textContent = "📁 " + name;
            div.onclick = () => switchFolder(name);
            folderListUI.appendChild(div);
        });
    }

    function switchFolder(name) {
        currentFolderName = name;
        currentQueue = library[name];
        updateFolderUI();
        
        document.getElementById('viewTitle').textContent = name;
        document.getElementById('viewSubtitle').textContent = `共 ${currentQueue.length} 首音乐`;
        
        songListBody.innerHTML = "";
        currentQueue.forEach((file, index) => {
            const tr = document.createElement('tr');
            if (currentIndex === index && currentFolderName === name) tr.className = 'active';
            tr.innerHTML = `<td>${index + 1}</td><td>${file.name}</td><td>${file.name.split('.').pop().toUpperCase()}</td>`;
            tr.onclick = () => playSong(index);
            songListBody.appendChild(tr);
        });
    }

    // 2. 播放逻辑
    async function playSong(index) {
        if (index < 0 || index >= currentQueue.length) return;
        currentIndex = index;
        const fileHandle = currentQueue[index];
        const file = await fileHandle.getFile();
        
        if (audio.src) URL.revokeObjectURL(audio.src);
        audio.src = URL.createObjectURL(file);
        audio.play();
        
        playPauseBtn.textContent = "⏸";
        document.getElementById('footerName').textContent = file.name;
        document.getElementById('footerFolder').textContent = currentFolderName;
        
        // 更新列表高亮
        const rows = songListBody.querySelectorAll('tr');
        rows.forEach((row, i) => row.className = i === index ? 'active' : '');
    }

    playPauseBtn.onclick = () => {
        if (audio.paused) {
            audio.play();
            playPauseBtn.textContent = "⏸";
        } else {
            audio.pause();
            playPauseBtn.textContent = "▶";
        }
    };

    document.getElementById('nextBtn').onclick = () => {
        let next = isShuffle ? Math.floor(Math.random() * currentQueue.length) : currentIndex + 1;
        if (next >= currentQueue.length) next = 0;
        playSong(next);
    };

    document.getElementById('prevBtn').onclick = () => {
        let prev = currentIndex - 1;
        if (prev < 0) prev = currentQueue.length - 1;
        playSong(prev);
    };

    // 3. 进度条与音量
    audio.ontimeupdate = () => {
        const per = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = per + "%";
        document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
        document.getElementById('durationTime').textContent = formatTime(audio.duration || 0);
    };

    progressBar.onclick = (e) => {
        const rect = progressBar.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pos * audio.duration;
    };

    volumeSlider.oninput = (e) => { audio.volume = e.target.value; };

    // 4. 模式切换
    shuffleBtn.onclick = () => {
        isShuffle = !isShuffle;
        shuffleBtn.classList.toggle('active', isShuffle);
    };

    loopBtn.onclick = () => {
        loopMode = (loopMode + 1) % 2;
        loopBtn.textContent = loopMode === 1 ? "🔂" : "🔁";
        loopBtn.classList.toggle('active', loopMode === 1);
    };

    audio.onended = () => {
        if (loopMode === 1) {
            playSong(currentIndex);
        } else {
            document.getElementById('nextBtn').click();
        }
    };

    function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
</script>
</body>
</html>
