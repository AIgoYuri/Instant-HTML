<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级正则工具箱 - Coding Partner</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --highlight: #fef08a;
            --highlight-border: #facc15;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 1100px;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preset-section {
            padding: 15px 30px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            outline: none;
            flex: 1;
            font-size: 14px;
        }

        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }

        .panel {
            display: flex;
            flex-direction: column;
            padding: 20px 30px;
            border-right: 1px solid var(--border);
            overflow-y: auto;
        }

        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }

        .regex-bar {
            display: flex;
            align-items: center;
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 0 15px;
        }
        .regex-bar:focus-within { border-color: var(--primary); }
        .regex-bar input { border: none; outline: none; padding: 12px 5px; font-family: monospace; font-size: 15px; }
        #pattern { flex: 1; }
        #flags { width: 50px; color: var(--primary); font-weight: bold; text-align: center; }

        textarea, #preview {
            flex: 1;
            width: 100%;
            min-height: 200px;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        textarea { outline: none; resize: none; }
        textarea:focus { border-color: var(--primary); }

        .match {
            background: var(--highlight);
            border-bottom: 2px solid var(--highlight-border);
            border-radius: 2px;
        }

        .desc-box {
            font-size: 13px;
            color: var(--primary);
            background: #eef2ff;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            border-left: 4px solid var(--primary);
        }

        .error-msg { color: #ef4444; font-size: 12px; margin-top: 5px; }

        footer {
            padding: 15px 30px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="app">
    <header>
        <h2 style="color: var(--primary);">正则表达式实验室</h2>
    </header>

    <div class="preset-section">
        <label style="margin-bottom: 0;">常用预设：</label>
        <select id="preset-select">
            <option value="">-- 自定义输入 --</option>
            </select>
    </div>

    <div class="main-content">
        <div class="panel">
            <div class="input-group">
                <label>正则表达式</label>
                <div class="regex-bar">
                    <span style="color:#94a3b8">/</span>
                    <input type="text" id="pattern" placeholder="在此输入正则模式...">
                    <span style="color:#94a3b8">/</span>
                    <input type="text" id="flags" value="g" placeholder="gim">
                </div>
                <div id="error" class="error-msg"></div>
                <div id="description" class="desc-box">当前处于自定义模式</div>
            </div>

            <div class="input-group" style="flex: 1; display: flex; flex-direction: column;">
                <label>测试文本</label>
                <textarea id="test-text">示例数据：
我的邮箱是 coding_partner@example.com
我的电话是 13812345678
今天是 2024-05-20
网址：https://www.google.com
<div>这段文字在HTML标签里</div>
123456@qq.com
                </textarea>
            </div>
        </div>

        <div class="panel" style="border-right: none;">
            <label>匹配结果预览</label>
            <div id="preview"></div>
        </div>
    </div>

    <footer>
        <span id="match-info">找到 0 处匹配</span>
        <span>Coding Partner 协助构建</span>
    </footer>
</div>

<script>
    // 定义 20 个常用的正则表达式预设
    const regexPresets = [
        { label: "手机号 (中国大陆)", pattern: "1[3-9]\\d{9}", flags: "g", desc: "匹配 11 位中国大陆手机号码" },
        { label: "电子邮箱 (Email)", pattern: "[\\w\\.-]+@[\\w\\.-]+\\.[a-zA-Z]{2,}", flags: "g", desc: "标准电子邮箱格式" },
        { label: "身份证号 (18位)", pattern: "[1-9]\\d{5}(18|19|20)\\d{2}((0[1-9])|(1[0-2]))(([0-2][1-9])|10|20|30|31)\\d{3}[0-9Xx]", flags: "g", desc: "匹配中国二代身份证号码" },
        { label: "URL 网址", pattern: "https?:\\/\\/(www\\.)?[-a-zA-Z0-9@:%._\\+~#=]{1,256}\\.[a-zA-Z0-9()]{1,6}\\b([-a-zA-Z0-9()@:%_\\+.~#?&//=]*)", flags: "g", desc: "匹配 http 或 https 开头的网址" },
        { label: "IPv4 地址", pattern: "((2(5[0-5]|[0-4]\\d))|[0-1]?\\d{1,2})(\\.((2(5[0-5]|[0-4]\\d))|[0-1]?\\d{1,2})){3}", flags: "g", desc: "匹配标准的 IPv4 地址" },
        { label: "中文字符", pattern: "[\\u4e00-\\u9fa5]", flags: "g", desc: "匹配单个中文字符（Unicode 范围）" },
        { label: "日期 (YYYY-MM-DD)", pattern: "\\d{4}-\\d{2}-\\d{2}", flags: "g", desc: "匹配形如 2024-05-20 的日期格式" },
        { label: "HTML 标签", pattern: "<[^>]+>", flags: "g", desc: "匹配所有 HTML 标签，常用于清洗文本" },
        { label: "强密码校验", pattern: "(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)[a-zA-Z\\d]{8,}", flags: "g", desc: "最少8位，包含大写字母、小写字母和数字" },
        { label: "正整数", pattern: "^[1-9]\\d*$", flags: "g", desc: "匹配不以0开头的正整数" },
        { label: "十六进制颜色", pattern: "#?([a-fA-F0-9]{6}|[a-fA-F0-9]{3})", flags: "g", desc: "匹配 CSS 中的 Hex 颜色值" },
        { label: "数字 (含小数)", pattern: "-?\\d+(\\.\\d+)?", flags: "g", desc: "匹配整数、负数及浮点数" },
        { label: "QQ 号码", pattern: "[1-9][0-9]{4,10}", flags: "g", desc: "匹配 5-11 位的腾讯 QQ 号" },
        { label: "邮政编码 (中国)", pattern: "[1-9]\\d{5}(?!\\d)", flags: "g", desc: "匹配 6 位数字的中国邮政编码" },
        { label: "空白行", pattern: "^\\s*\\n", flags: "gm", desc: "匹配文本中的空行，常用于代码清理" },
        { label: "首尾空格", pattern: "^\\s+|\\s+$", flags: "gm", desc: "匹配行首或行尾的空白字符" },
        { label: "XML 注释", pattern: "", flags: "g", desc: "匹配 XML 或 HTML 中的注释内容" },
        { label: "双字节字符", pattern: "[^\\x00-\\xff]", flags: "g", desc: "包含汉字、全角符号等" },
        { label: "帐号合法性", pattern: "^[a-zA-Z][a-zA-Z0-9_]{4,15}$", flags: "g", desc: "字母开头，5-16字节，允许字母数字下划线" },
        { label: "微信号", pattern: "^[a-zA-Z][-_a-zA-Z0-9]{5,19}$", flags: "g", desc: "6-20位，字母开头，可包含数字、下划线和减号" }
    ];

    const select = document.getElementById('preset-select');
    const patternInput = document.getElementById('pattern');
    const flagsInput = document.getElementById('flags');
    const textInput = document.getElementById('test-text');
    const previewEl = document.getElementById('preview');
    const descEl = document.getElementById('description');
    const errorEl = document.getElementById('error');
    const infoEl = document.getElementById('match-info');

    // 初始化下拉菜单
    regexPresets.forEach((item, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = item.label;
        select.appendChild(opt);
    });

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function runTest() {
        const pattern = patternInput.value;
        const flags = flagsInput.value;
        const text = textInput.value;
        
        errorEl.textContent = '';
        
        if (!pattern) {
            previewEl.innerHTML = escapeHtml(text);
            infoEl.textContent = "找到 0 处匹配";
            return;
        }

        try {
            const regex = new RegExp(pattern, flags);
            let count = 0;
            
            const highlighted = text.replace(regex, (match) => {
                count++;
                return `<span class="match">${escapeHtml(match)}</span>`;
            });

            previewEl.innerHTML = highlighted;
            infoEl.textContent = `找到 ${count} 处匹配`;
        } catch (e) {
            errorEl.textContent = "正则语法有误: " + e.message;
            previewEl.innerHTML = escapeHtml(text);
        }
    }

    // 处理预设切换
    select.addEventListener('change', () => {
        const index = select.value;
        if (index !== "") {
            const item = regexPresets[index];
            patternInput.value = item.pattern;
            flagsInput.value = item.flags;
            descEl.textContent = "功能备注: " + item.desc;
        } else {
            descEl.textContent = "当前处于自定义模式";
        }
        runTest();
    });

    [patternInput, flagsInput, textInput].forEach(el => {
        el.addEventListener('input', runTest);
    });

    // 默认运行一次
    runTest();
</script>

</body>
</html>
